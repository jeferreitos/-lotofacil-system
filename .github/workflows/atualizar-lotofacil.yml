name: Atualizar Lotofácil

on:
  schedule:
    - cron: '15 0 * * 0,2,3,4,5,6'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Importar todos os concursos faltantes (carga inicial)'
        required: false
        default: 'false'

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Edge Function
        # --fail-with-body faz o job ficar vermelho (e mostrar o erro) quando a
        # function responde com erro, em vez de passar verde silenciosamente.
        # O backfill vai na URL (?backfill=) e no corpo, pra funcionar com a
        # versão antiga e a nova da function.
        # No Supabase a function aparece com o nome "importar-concursos", mas
        # o endereço (slug) dela é "swift-action".
        run: |
          curl -sS --fail-with-body -w "\nHTTP_STATUS:%{http_code}\n" -X POST "${{ secrets.SUPABASE_FUNCTIONS_URL }}/swift-action?backfill=${{ github.event.inputs.backfill || 'false' }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"backfill\": ${{ github.event.inputs.backfill || 'false' }}}"
