name: Atualizar Lotofácil

on:
  schedule:
    - cron: '15 0 * * 0,2,3,4,5,6'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Importar todos os concursos faltantes (carga inicial)'
        required: false
        default: 'false'

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Edge Function
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_FUNCTIONS_URL }}/importar-concursos" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"backfill\": ${{ github.event.inputs.backfill || 'false' }}}"
